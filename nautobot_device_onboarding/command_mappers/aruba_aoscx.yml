---
sync_devices:
  hostname:
    commands:
      - command: "show system"
        parser: "textfsm"
        jpath: "[*].hostname"
  serial:
    commands:
      - command: "show system"
        parser: "textfsm"
        jpath: "[*].serial[]"
        post_processor: "{{ obj | unique | first }}"
        iterable_type: "str"
  device_type:
    commands:
      - command: "show system"
        parser: "textfsm"
        jpath: "[*].product[]"
        post_processor: "{{ obj | unique | first }}"
        iterable_type: "str"
  mgmt_interface:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?contains(ip_address, `{{ obj }}`)].{name: interface, enabled: link_status}"
        post_processor: "{{ (obj | selectattr('enabled', 'eq', 'up') | list | first ).name }}"
  mask_length:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?contains(ip_address, `{{ obj }}`)].prefix_length"
        iterable_type: "int"
sync_network_data:
  pre_processor:
    vlan_map:
      commands:
        - command: "show vlan"
          parser: "textfsm"
          # Since we use the jdiff custom jmespath we have access to save keys with $ syntax.
          jpath: "[*].[$vlan_id$,vlan_name]"
          post_processor: "{{ obj | flatten_list_of_dict_from_value('vlan_name') | tojson }}"
  serial:
    commands:
      - command: "show system"
        parser: "textfsm"
        jpath: "[*].serial[]"
        post_processor: "{{ obj | unique | first }}"
        iterable_type: "str"
  interfaces:
    root_key: true
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[*].interface"  # when root_key=true this extracted value is what becomes interable in keys using __ under `current_key`.
        post_processor: "{% set result={} %}{% for interface in obj %}{{ result.update({interface: {}}) or '' }}{% endfor %}{{ result | tojson }}"
  interfaces__type:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?interface=='{{ current_key }}'].hw_type"
        post_processor: "{{ obj[0] | map_interface_type }}"
  interfaces__ip_addresses:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?interface=='{{ current_key }}'].{ip_address: ip_address, prefix_length: prefix_length}"
        iterable_type: "list"
  interfaces__mtu:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?interface=='{{ current_key }}'].mtu"
        iterable_type: "str"
  interfaces__mac_address:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?interface=='{{ current_key }}'].mac_address"
  interfaces__description:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?interface=='{{ current_key }}'].interface_desc"
  interfaces__link_status:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?interface=='{{ current_key }}'].link_status"
        post_processor: "{{ obj[0] | interface_status_to_bool }}"
  interfaces__802.1Q_mode:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?interface=='{{ current_key }}'].vlan_mode"
        post_processor: "{% if obj | length > 0 %}{{ obj[0] | port_mode_to_nautobot }}{% else %}{{ obj }}{% endif %}"
        iterable_type: "str"
  interfaces__lag:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?contains(@.aggregated_interfaces, `{{ current_key | abbreviated_interface_name }}`)].interface"
        post_processor: "{% if obj | length > 0 %}{{ obj[0] | canonical_interface_name }}{% else %}[]{% endif %}"
        iterable_type: "str"
  interfaces__tagged_vlans:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?interface=='{{ current_key }}'].{native_vlan: vlan_native, access_vlan: vlan_access, trunking_vlans: vlan_trunk, admin_mode: vlan_mode, mode: vlan_mode}"
        post_processor: "{{ obj | get_vlan_data(vlan_map, 'tagged') | tojson }}"
  interfaces__untagged_vlan:
    commands:
      - command: "show interface"
        parser: "textfsm"
        jpath: "[?interface=='{{ current_key }}'].{native_vlan: vlan_native, access_vlan: vlan_access, trunking_vlans: vlan_trunk, admin_mode: vlan_mode, mode: vlan_mode}"
        post_processor: "{{ obj | get_vlan_data(vlan_map, 'untagged') | tojson }}"
        iterable_type: "dict"
  software_version:
    commands:
      - command: "show system"
        parser: "textfsm"
        jpath: "[*].version[]"
        post_processor: "{{ obj | unique | first }}"
        iterable_type: "str"
